$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Search Form
status: stable
description: 'Inline GET search form. The label sits inside the input (GOV.UK inline label pattern) and is covered by the input on focus or when a value is present. Adjoining magnifier submit button with pill borders. A digital.gov.au extension.'
props:
  type: object
  properties:
    theme:
      type: string
      title: Theme
      description: Theme variation (light or dark).
      enum:
        - light
        - dark
      default: light
    action:
      type: string
      title: Action
      description: Form action URL (the search results page).
      default: /search
    input_name:
      type: string
      title: Input name
      description: DOM name / query parameter the keyword is submitted as.
      default: keywords
    input_id:
      type: string
      title: Input id
      description: Input DOM id, used to associate the visible label.
      default: ct-search-form-input
    label:
      type: string
      title: Label
      description: Label text displayed inside the input at rest; covered by the input on focus or when a value is present.
      default: Search
    placeholder:
      type:
        - string
        - 'null'
      title: Placeholder
      description: Placeholder text for the input.
    value:
      type:
        - string
        - 'null'
      title: Value
      description: Pre-filled keyword value.
    button_text:
      type: string
      title: Button text
      description: Accessible (visually hidden) label for the icon-only submit button.
      default: Search
    modifier_class:
      type: string
      title: Modifier class
      description: Additional CSS classes.
