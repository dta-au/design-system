name: Summary List
status: stable
description: A definition list displaying key/value pairs in rows with optional action links. Commonly used for review and confirmation screens.
props:
  type: object
  properties:
    theme:
      type: string
      enum:
        - light
        - dark
    no_border:
      type: boolean
    id:
      type: string
      description: Optional id on the <dl>, e.g. so a filterable-table control set can target it.
    items:
      type: array
      items:
        type: object
        required:
          - key
          - value
        properties:
          key:
            type: string
          value:
            type: string
          action_url:
            type: string
          action_text:
            type: string
          filter_values:
            type: array
            description: Optional per-column filterable values (order matches the filterable-table columns). When set, the row carries data-filter-row plus data-filter-col-N attributes.
            items:
              type: string
    modifier_class:
      type: string
