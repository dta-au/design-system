$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Link List
status: stable
description: A group of link-card items with an optional heading. Owns the group heading and the spacing between cards, so the cards stay layout-free. A digital.gov.au extension.
props:
  type: object
  properties:
    theme:
      type: string
      title: Theme
      description: Theme variation (light or dark).
      enum:
        - light
        - dark
    heading_level:
      type: integer
      title: Heading level
      description: Heading level for the title.
      enum:
        - 2
        - 3
        - 4
        - 5
        - 6
    variant:
      type: string
      title: Variant
      description: List variant. "connected" renders the cards as one bordered group with rounded outer corners, hairline separators between cards, and no gaps.
      enum:
        - default
        - connected
    title:
      type: string
      title: Title
      description: Group heading rendered above the cards.
    items:
      type: array
      title: Items
      description: Link list card items. Each is rendered as a link-card.
      items:
        type: object
        required:
          - title
        properties:
          variant:
            type: string
            title: Variant
            description: Card type (default or download).
            enum:
              - default
              - download
          title:
            type: string
            title: Title
            description: Link text.
          url:
            type: string
            title: URL
            description: Link URL. Optional when the item is deactivated.
          file_extension:
            type: string
            title: File extension
            description: File extension label for the download variant, e.g. "PDF".
          file_size:
            type: string
            title: File size
            description: File size label for the download variant, e.g. "1.2 MB".
          is_secured:
            type: boolean
            title: Secured
            description: Marks a secured/gated resource, adding a padlock beside the type icon.
          is_external:
            type: boolean
            title: External
            description: Whether the link is external.
          is_new_window:
            type: boolean
            title: New window
            description: Whether to open the link in a new window.
          is_deactivated:
            type: boolean
            title: Deactivated
            description: Render the card in a non-interactive deactivated state.
    modifier_class:
      type: string
      title: Modifier classes
      description: Additional CSS classes.
