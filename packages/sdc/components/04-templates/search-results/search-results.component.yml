$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Search Results Page Template
status: stable
description: Full-page template that places search filters and results into the CivicTheme layout system. Supports a left sidebar layout (filters collapse above content on mobile) and a horizontal filter bar layout.
props:
  type: object
  properties:
    theme:
      type: string
      title: Theme
      description: Theme variation (light or dark).
      enum:
        - light
        - dark
    heading_level:
      type: integer
      title: Heading level
      description: Heading level for filter group headings.
      enum:
        - 2
        - 3
        - 4
        - 5
        - 6
    filter_layout:
      type: string
      title: Filter layout
      description: Placement of filters — left sidebar or horizontal bar.
      enum:
        - left
        - horizontal
    filter_label:
      type: string
      title: Filter section label
      description: Label shown above the filter groups (left layout) or in the filter bar (horizontal).
    filter_toggle_label:
      type: string
      title: Mobile filter toggle label
      description: Label for the mobile toggle button (horizontal layout only). Defaults to 'Filters'.
    apply_label:
      type: string
      title: Apply filters button label
    clear_label:
      type: string
      title: Clear filters button label
    results_summary:
      type: string
      title: Results summary
      description: Summary text shown above results (e.g. "Showing 1–10 of 42 results").
    filters:
      type: array
      title: Filter groups
      items:
        type: object
        properties:
          type:
            type: string
            enum:
              - checkbox
              - radio
              - date_range
          label:
            type: string
          name:
            type: string
          options:
            type: array
            items:
              type: object
              properties:
                label:
                  type: string
                value:
                  type: string
                count:
                  type: integer
                is_checked:
                  type: boolean
    sort_filters:
      type: array
      title: Sort filter groups
      items:
        type: object
        properties:
          type:
            type: string
            enum:
              - checkbox
              - radio
              - date_range
          label:
            type: string
          name:
            type: string
          options:
            type: array
            items:
              type: object
              properties:
                label:
                  type: string
                value:
                  type: string
                count:
                  type: integer
                is_checked:
                  type: boolean
    results:
      type: array
      title: Result items
      items:
        type: object
        properties:
          title:
            type: string
          url:
            type: string
          description:
            type: string
    header_theme:
      type: string
      title: Header theme
      enum:
        - light
        - dark
    footer_theme:
      type: string
      title: Footer theme
      enum:
        - light
        - dark
    footer_background_image:
      type: string
      title: Footer background image
    modifier_class:
      type: string
      title: Modifier classes
slots:
  search:
    title: Search bar
    description: Pre-rendered search bar component.
  pagination:
    title: Pagination
    description: Pre-rendered pagination component.
  banner:
    title: Banner
    description: Pre-rendered banner component.
  header_top_1:
    title: Header top 1
  header_top_2:
    title: Header top 2
  header_top_3:
    title: Header top 3
  header_middle_1:
    title: Header middle 1
  header_middle_2:
    title: Header middle 2
  header_middle_3:
    title: Header middle 3
  header_bottom_1:
    title: Header bottom 1
  footer_top_1:
    title: Footer top 1
  footer_top_2:
    title: Footer top 2
  footer_middle_1:
    title: Footer middle 1
  footer_middle_2:
    title: Footer middle 2
  footer_middle_3:
    title: Footer middle 3
  footer_middle_4:
    title: Footer middle 4
  footer_bottom_1:
    title: Footer bottom 1
  footer_bottom_2:
    title: Footer bottom 2
