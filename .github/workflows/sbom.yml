name: SBOM

# Generates CycloneDX SBOMs (npm sbom + manual annex) and gates on a Grype
# scan of the dev SBOM. Reusable via workflow_call - release.yml runs it as a
# pre-publish gate and other repos can call the syft/grype jobs. See docs/sbom.md.
#
# anchore/* actions are pinned by commit SHA, not tag: scanners run with CI
# credentials and are themselves supply-chain targets (cf. the March 2026
# Trivy compromise). actions/* stay tag-pinned per repo convention.

on:
  workflow_call:
    inputs:
      fail-severity:
        description: 'Grype severity cutoff that fails the build'
        type: string
        default: 'high'
      version:
        description: 'Release tag or version to stamp onto the SBOMs (e.g. v1.14.1)'
        type: string
        default: ''
  pull_request:
    paths:
      - package-lock.json
      - package.json
      - 'packages/*/package.json'
      - tools/sbom/**
      - tools/scripts/sbom-generate.js
      - .grype.yaml
      - .github/workflows/sbom.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          # Only puppeteer-core metadata is needed for version resolution.
          PUPPETEER_SKIP_DOWNLOAD: '1'

      - name: Run sbom-generate tests
        run: node tools/scripts/tests/sbom-generate.test.js

      - name: Generate SBOMs
        run: |
          set -euo pipefail
          ARGS=""
          if [ -n "${{ inputs.version }}" ]; then
            ARGS="--version ${{ inputs.version }}"
          fi
          node tools/scripts/sbom-generate.js $ARGS

      - uses: actions/upload-artifact@v7
        with:
          name: sboms
          path: .logs/sbom/
          if-no-files-found: error

  syft-crosscheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          artifact-name: sbom-syft.cdx.json
          upload-artifact: true

  scan:
    needs: generate
    runs-on: ubuntu-latest
    steps:
      # Checkout brings .grype.yaml (suppressions) into the working directory.
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: sboms
          path: .logs/sbom

      # Scans the dev SBOM only: the dist SBOMs are two-component inventory
      # documents and scanning them adds noise, not signal. only-fixed keeps
      # the gate actionable; Renovate vulnerabilityAlerts covers fixless CVEs.
      - uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          sbom: .logs/sbom/uikit-dev.cdx.json
          fail-build: true
          only-fixed: true
          severity-cutoff: ${{ inputs.fail-severity || 'high' }}
          output-format: table
